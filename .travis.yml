language: go

_dep_ensure: &_dep_ensure
  go: "1.11"
  before_install:
    - mkdir -p $GOPATH/bin
    - curl -fsSL -o $GOPATH/bin/dep https://github.com/golang/dep/releases/download/v0.5.0/dep-linux-amd64
    - chmod +x $GOPATH/bin/dep
    # `go_import_path` symlinks the checkout under $GOPATH/src but leaves the
    # shell in the real build dir, which `dep` rejects ("is not within a known
    # GOPATH/src"). Enter it via the GOPATH path instead.
    - cd $GOPATH/src/github.com/osrg/gobgp
  install: $GOPATH/bin/dep ensure

_unittest: &_unittest
  <<: *_dep_ensure
  script:
    - go test $([ $(go env GOARCH) == 'amd64' ] && echo '-race') $(go list ./... | grep -v '/vendor/') -timeout 120s
    - if [ "$(go env GOARCH)" = "amd64" ]; then go test -race github.com/osrg/gobgp/pkg/packet/bgp -run ^Test_RaceCondition$; else echo 'skip'; fi

_build: &_build
  <<: *_dep_ensure
  script:
    - go build -o ./cmd/gobgp/gobgp   ./cmd/gobgp/
    - go build -o ./cmd/gobgpd/gobgpd ./cmd/gobgpd/

matrix:
  include:
#
# Unit Tests
#
    - <<: *_unittest
      env:
        - DESCRIPTION="Unit Tests"
      go: 1.11
    - <<: *_unittest
      env:
        - DESCRIPTION="Tests + goreleaser + cover"
      go: "1.11"
      script:
        - go test $(go list ./... | grep -v '/vendor/') -coverprofile=coverage.txt -covermode=atomic
    - <<: *_unittest
      env:
        - DESCRIPTION="Unit Tests on i386"
      before_script:
        - export GOARCH="386"
        - go env

#
# Cross-compile
#
# Note: We use "before_script" to enable "go env" settings. The following keeps
# "env" sections as just markers of Travis-CI Web UI.
# See https://github.com/travis-ci/travis-ci/issues/6126
    - <<: *_build
      env:
        - GOOS="openbsd"
      before_script:
        - export GOOS="openbsd"
        - go env
    - <<: *_build
      env:
        - GOOS="freebsd"
      before_script:
        - export GOOS="freebsd"
        - go env
    - <<: *_build
      env:
        - GOOS="darwin"
      before_script:
        - export GOOS="darwin"
        - go env

cache:
  pip: true

go_import_path: github.com/osrg/gobgp
